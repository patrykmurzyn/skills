name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate skills
        run: scripts/validate.sh
      - name: Check the catalog is up to date
        run: uv run scripts/catalog.py --check
